name: Go CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test & Verify 100% Coverage
        run: |
          go test -count=1 -coverprofile=cover.out ./...
          awk 'NR>1 && $NF==0 {print; bad=1} END{exit bad}' cover.out
